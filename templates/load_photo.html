<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div>
    <div class="container mt-5">
        <div class="row">
            <div class="col">
                <div class="mb-3">
                    <h2>Загрузка фотографии</h2>
                    <h4>для участия в миссии</h4>
                </div>
                <form class="upload_from" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Приложите фотографию</label>
                        <input type="file" id="file" class="form-control" name="file">
                    </div>
                    <div class="mb-3">
                        <img src="{{ url_for('static', filename='images/loaded_image.png') }}" alt="">
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
